<!doctype html>
<html lang="ru">
<head>
  <link rel="icon" href="/shared/cs2tasks.ico" sizes="any">
  <meta charset="utf-8">
  <title>CS2 Tasks — оверлей</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/overlay/overlay.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/bingo.css">
  <link rel="stylesheet" href="/shared/task-vote.css">
</head>
<body class="cs-overlay">
  <div id="root">
    <header id="header" hidden>
      <div class="hdr-match" id="hdr-match" hidden>
        <span class="map" id="hdr-map"></span>
        <span class="score" id="hdr-score"></span>
        <span class="round" id="hdr-round"></span>
      </div>
      <div class="counter" id="counter" hidden title="Выполнено заданий с запуска программы">
        <span class="counter-icon" id="counter-icon"></span>
        <span class="counter-num" id="counter-num">0</span>
        <span class="counter-label">выполнено</span>
      </div>
    </header>
    <section id="points" class="points" hidden>
      <div class="points-row">
        <span class="points-label" id="points-label">ОЧКИ</span>
        <span class="points-num"><b id="points-score">0</b><small id="points-goal">/ 0</small></span>
      </div>
      <div class="points-bar"><div class="points-fill" id="points-fill"></div></div>
    </section>
    <section id="bingo-board" hidden></section>
    <div id="cards"></div>
    <section id="task-vote" class="task-vote" hidden></section>
  </div>
  <div id="fx"></div>
  <script src="/overlay/weapons.js"></script><script src="/overlay/icons.js"></script>
  <script type="module" src="/overlay/overlay.js"></script>
</body>
</html>
