<!doctype html><meta charset="utf-8"><title>Weapon icons</title><style>body{margin:0;padding:36px;background:#202b31;color:#eef0e9;font:16px Arial}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,180px);gap:16px}.tile{background:#303c43;padding:24px;border:1px solid #56646d}.large{height:64px;display:flex;align-items:center}.large svg{width:128px;height:68px}.small{margin-top:16px;display:flex;align-items:center;gap:12px;color:#e5b34d}.small svg{width:32px;height:32px}p{color:#aab6bb}</style><h1>Оружие — новые силуэты</h1><p>Крупный вид и размер в оверлее (32 px)</p><main></main><script src="/overlay/weapons.js"></script><script src="/overlay/icons.js"></script><script>for(const [id,name] of Object.entries({rifle:'Винтовка',pistol:'Пистолет',sniper:'Снайперка',knife:'Нож',shotgun:'Дробовик',smg:'Пистолет-пулемёт',machinegun:'Пулемёт'})){const el=document.createElement('div');el.className='tile';el.innerHTML='<div class="large">'+OverlayIcons.svg(id)+'</div><div class="small">'+OverlayIcons.svg(id)+'</div><p>'+name+'</p>';document.querySelector('main').append(el)}</script>
