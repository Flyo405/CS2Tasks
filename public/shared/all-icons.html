<!doctype html><meta charset="utf-8"><title>Все иконки</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#202b31;color:#edf0ed;font:14px Arial}h1{font-size:28px;margin:0 0 10px}h2{font-size:20px;margin:32px 0 16px;color:#e5b34d}p{color:#aebcc2}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}.tile{min-height:110px;padding:15px 8px 12px;background:#2b373e;border:1px solid #48575e;text-align:center}.art{height:57px;display:flex;align-items:center;justify-content:center}.art svg{width:100%;max-width:108px;height:48px}.symbols .art svg{width:34px;height:34px}.label{margin-top:12px;color:#d7dfdf;font-size:12px}</style><h1>Все иконки программы</h1><p>Оружие и символы заданий · одинаковый набор в панели и оверлее</p><h2 id="weapons-heading"></h2><div id="weapons" class="grid"></div><h2 id="symbols-heading"></h2><div id="symbols" class="grid symbols"></div><script src="/overlay/weapons.js"></script><script src="/overlay/icons.js"></script><script>
const labels={ak47:'AK-47',aug:'AUG',awp:'AWP',bayonet:'Bayonet',bizon:'PP-Bizon',cz75a:'CZ75-Auto',deagle:'Desert Eagle',elite:'Dual Berettas',famas:'FAMAS',fiveseven:'Five-SeveN',g3sg1:'G3SG1',galilar:'Galil AR',glock:'Glock-18',hkp2000:'P2000',knife:'Knife',m249:'M249',m4a1:'M4A4',m4a1_silencer:'M4A1-S',mac10:'MAC-10',mag7:'MAG-7',mp5sd:'MP5-SD',mp7:'MP7',mp9:'MP9',negev:'Negev',nova:'Nova',p250:'P250',p90:'P90',revolver:'R8 Revolver',sawedoff:'Sawed-Off',scar20:'SCAR-20',sg556:'SG 553',ssg08:'SSG 08',taser:'Zeus x27',tec9:'Tec-9',ump45:'UMP-45',usp_silencer:'USP-S',xm1014:'XM1014'};
function tile(root,id,label){const el=document.createElement('div');el.className='tile';el.innerHTML='<div class="art">'+OverlayIcons.svg(id)+'</div>';const t=document.createElement('div');t.className='label';t.textContent=label;el.append(t);document.getElementById(root).append(el)}
const weapons=Object.keys(WeaponSilhouettes);for(const id of weapons)tile('weapons',id,labels[id.replace('weapon_','')]||id);document.getElementById('weapons-heading').textContent='Оружие — '+weapons.length;
const symbols={headshot:'Хедшот',kevlar:'Без брони',syringe:'Мало HP',bomb:'Последние секунды',bullet:'Последний патрон',combo:'Комбо',smoke:'В дыму',crosshair:'Прицел',bolt:'Электрошок',flame:'Серия / огонь',skull:'Эйс / смерти',impact:'Удар',star:'MVP',assist:'Ассист',shield:'Броня / выживание',heart:'Здоровье',flash:'Ослепление',wallet:'Эко',flag:'Победа в раунде',spin:'Разворот 360°',jump:'Прыжок',noscope:'Ноускоп',trophy:'Победа / выполнено',chart:'K/D',edit:'Своё задание',close:'Закрыть / провал'};for(const [id,label]of Object.entries(symbols))tile('symbols',id,label);document.getElementById('symbols-heading').textContent='Символы — '+Object.keys(symbols).length;
</script>
